zsh:
  externals:
    .oh-my-zsh/custom/plugins/zsh-autosuggestions:
      type: archive
      url: https://github.com/zsh-users/zsh-autosuggestions/archive/refs/heads/master.tar.gz
      exact: true
      stripComponents: 1
      refreshPeriod: 168h

    .oh-my-zsh/custom/plugins/zsh-syntax-highlighting:
      type: archive
      url: https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/heads/master.tar.gz
      exact: true
      stripComponents: 1
      refreshPeriod: 168h
  editor: nano
  starship: true
  project_path: ~/Projects
  theme: ""
  plugins:
    - zsh-autosuggestions
    - zsh-syntax-highlighting
    - fzf
    - zoxide
    - git
    - kubectl
    - fluxcd
    - laravel
  aliases:
    ls: eza --icons=always
    cat: bat --paging=never
    cdp: builtin cd "$(find "$GHQ_ROOT" -name .git -type d -prune -print | sed "s|/.git$||" | fzf)"
  init:
    - eval "$(zoxide init zsh --cmd cd)"